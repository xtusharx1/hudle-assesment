services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hudle
      MYSQL_USER: hudle
      MYSQL_PASSWORD: ${DB_PASSWORD:-hudle_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_only}
    ports: ["127.0.0.1:3308:3306"]
    volumes: ["hudle-data:/var/lib/mysql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: hudle
      DB_PASSWORD: ${DB_PASSWORD:-hudle_local}
      DB_NAME: hudle
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-PlayWithHudle!2026}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-before-deploy}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  hudle-data:
